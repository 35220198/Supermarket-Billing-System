<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Responsive supermarket billing system: pick products, add to cart, see totals, print a receipt.">
<title>Supermarket Billing System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="cart" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M2 3h3l2.600 12.500h11L21 7H6M9.500 20.500h.01M17.500 20.500h.01"/></symbol>
  <symbol id="printer" viewBox="0 0 24 24"><path fill="currentColor" d="M7 3h10v4H7V3Zm-2 5h14a3 3 0 0 1 3 3v6h-4v4H6v-4H2v-6a3 3 0 0 1 3-3Zm3 7v4h8v-4H8Zm10-4a1 1 0 1 0 0 2 1 1 0 0 0 0-2Z"/></symbol>
  <symbol id="trash" viewBox="0 0 24 24"><path fill="currentColor" d="M9 3h6l1 2h4v2H4V5h4l1-2ZM5 9h14l-1 12H6L5 9Zm4 2v8h2v-8H9Zm4 0v8h2v-8h-2Z"/></symbol>
</svg>

<header class="store no-print">
  <div class="sign"><span>SUPERMARKET</span></div>
  <div class="awning" aria-hidden="true"></div>
  <p class="shelf" aria-hidden="true">🛒 🍎 🍌 🥕 🥛 🍞 🍊 💧</p>
</header>

<main class="layout">
  <section class="panel no-print" aria-labelledby="title">
    <div class="title">
      <svg class="title-ico"><use href="#cart"/></svg>
      <h1 id="title">Supermarket<br>Billing System</h1>
    </div>

    <form id="addForm" class="controls">
      <label for="product">Select Product</label>
      <select id="product"></select>
      <label for="qty">Quantity</label>
      <div class="qty-add">
        <div class="stepper">
          <input type="number" id="qty" value="1" min="1" max="99" inputmode="numeric">
          <div class="steps"><button type="button" id="up" aria-label="Increase">&#9650;</button><button type="button" id="down" aria-label="Decrease">&#9660;</button></div>
        </div>
        <button type="submit" class="btn btn-blue"><svg><use href="#cart"/></svg>Add to Cart</button>
      </div>
    </form>

    <div class="table-wrap">
      <table class="bill">
        <thead><tr><th>Product</th><th>Qty</th><th>Price</th><th>Total</th><th class="x"><span class="sr">Remove</span></th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>

    <div class="total-bar"><span>Total Amount:</span><strong id="total">$0.00</strong></div>

    <div class="btns">
      <button class="btn btn-green" id="print"><svg><use href="#printer"/></svg>Print Receipt</button>
      <button class="btn btn-red" id="clear"><svg><use href="#trash"/></svg>Clear</button>
    </div>
  </section>

  <section class="receipt" id="receipt" aria-label="Receipt">
    <h2>Supermarket Receipt</h2>
    <p class="meta"><span id="rno"></span><span id="rdate"></span></p>
    <table>
      <thead><tr><th>Product</th><th>Qty</th><th>Price</th><th>Total</th></tr></thead>
      <tbody id="rrows"></tbody>
    </table>
    <div class="rtotal"><span>Total Amount:</span><strong id="rtotal">$0.00</strong></div>
    <p class="thanks">Thank you for shopping with us!</p>
  </section>
</main>

<div class="toast no-print" id="toast" role="status" aria-live="polite"></div>
<script src="script.js"></script>
</body>
</html>
